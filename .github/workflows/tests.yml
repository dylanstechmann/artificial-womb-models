name: Tests
on: [push, pull_request]
jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: wombmodels evidence-report --ledger config/evidence.json --out artifacts/evidence-ci
      - run: wombmodels simulate --config examples/exchange_fixture.json --out artifacts/exchange-ci
      - run: wombmodels identifiability-report --config examples/exchange_fixture.json --trajectory artifacts/exchange-ci/trajectory.csv --out artifacts/identifiability-ci
      - run: wombmodels design-sweep --config examples/exchange_fixture.json --out artifacts/design-sweep-ci --replicates 1
      - run: wombmodels transport-model --config examples/transport_fixture.json --out artifacts/transport-ci
      - run: wombmodels mechanics-model --config examples/mechanics_fixture.json --out artifacts/mechanics-ci
